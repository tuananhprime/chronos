<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS - Create L/C</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://kit.fontawesome.com/4383773ea8.js" crossorigin="anonymous"></script>
   
    <style>
        /* Style tùy chỉnh duy nhất để làm form L/C rộng hơn form T/T
           vì nó có nhiều trường hơn.
        */
        .main-content .form-card.lc-form {
            max-width: 1100px; /* Tăng độ rộng tối đa */
            margin: 0 auto; /* Tự động căn giữa */
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <div class="page-bg" aria-hidden="true"><img src="images/background.png" alt="background" class="bg-image"></div>
   
    <div class="dashboard-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo"><img src="images/logo_icon.png" alt="Logo Icon"><span class="brand-name">CHRONOS</span></div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="dashboard.html"><i class="fas fa-home"></i> <span>Dashboard</span></a></li>
                    <li><a href="transaction.html"><i class="fas fa-exchange-alt"></i> <span>Transactions</span></a></li>
                    <li><a href="document.html"><i class="fas fa-folder"></i> <span>Documents</span></a></li>
                    <li><a href="profile.html"><i class="fas fa-user"></i> <span>Profile</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-logout"><a href="login.html"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></div>
        </aside>
       
        <main class="main-content">
            <header class="main-header">
                <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
                <h1>Application for Letter of Credit</h1>
            </header>


            <form id="lc-application-form" class="form-card lc-form" novalidate>


                <section class="form-section">
                    <h2>Parties Involved</h2>
                   
                    <div class="form-grid">
                       
                        <div class="form-group">
                            <label for="applicant-name">Applicant (Tên Doanh Nghiệp):</label>
                            <input type="text" id="applicant-name" class="readonly-input" value="Doe Enterprises" placeholder="Tên công ty của bạn" readonly>
                            <div class="error-message" id="error-applicant-name"></div>
                        </div>
                       
                        <div class="form-group">
                            <label for="lc_type_selection">L/C Type</label>
                            <select id="lc_type_selection" name="lc_type" required>
                                <option value="" disabled selected>-- Select L/C Type --</option>
                                <option value="Irrevocable">Irrevocable</option>
                                <option value="revocable">Revocable</option>
                                <option value="Transferable">Transferable</option>
                                <option value="Standby">Standby</option>
                            </select>
                            <div class="error-message" id="error-lc_type_selection"></div>
                        </div>


                        <div class="form-group">
                            <label for="beneficiary_name">Beneficiary Name</label>
                            <input type="text" id="beneficiary_name" placeholder="Exp: Công ty ABC (Exporter)" required>
                            <div class="error-message" id="error-beneficiary_name"></div>
                        </div>
                        <div class="form-group">
                            <label for="advising_bank">Advising Bank</label>
                            <input type="text" id="advising_bank" placeholder="Exp: DBS Bank" required>
                            <div class="error-message" id="error-advising_bank"></div>
                        </div>


                        <div class="form-group">
                            <label for="address">Beneficiary Address</label>
                            <input type="text" id="address" placeholder="Exp: 123 Orchard Road, Singapore" required>
                            <div class="error-message" id="error-address"></div>
                        </div>
                       
                        <div class="form-group">
                             <label for="swift_bic_code">Advising Bank SWIFT/BIC Code</label>
                             <input type="text" id="swift_bic_code" placeholder="Exp: DBSSSGSG" required>
                             <div class="error-message" id="error-swift_bic_code"></div>
                        </div>


                        <div class="form-group">
                            <label for="country">Beneficiary Country</label>
                            <select id="country" required>
                                <option value="" disabled selected>-- Select Country --</option>
                                <option value="VNM">Vietnam</option>
                                <option value="SGP">Singapore</option>
                                <option value="USA">United States</option>
                            </select>
                            <div class="error-message" id="error-country"></div>
                        </div>
                    </div>
                </section>


                <section class="form-section">
                    <h2>L/C Details</h2>
                    <div class="form-grid">
                       
                        <div class="form-group">
                            <label>Payment Term</label>
                            <div class="fee-toggle">
                                <button type="button" class="fee-btn active" data-term="Usance">Usance</button>
                                <button type="button" class="fee-btn" data-term="AtSight">At Sight</button>
                            </div>
                            <input type="hidden" id="payment_term" value="Usance">
                        </div>
                       
                        <div class="form-group">
                            <label for="expiry_date">Expiry Date</label>
                            <input type="date" id="expiry_date" required>
                            <div class="error-message" id="error-expiry_date"></div>
                        </div>


                        <div class="form-group" id="usance-terms-group">
                            <label for="usance_terms">Usance Terms</label>
                            <input type="text" id="usance_terms" placeholder="Exp: Thanh toán sau 60 ngày kể từ ngày vận đơn">
                            <div class="error-message" id="error-usance_terms"></div>
                        </div>
                        <div class="form-group">
                            <label for="place_of_expiry">Place of Expiry</label>
                            <input type="text" id="place_of_expiry" placeholder="Exp: Ho Chi Minh City, Vietnam" required>
                            <div class="error-message" id="error-place_of_expiry"></div>
                        </div>
                    </div>
                    <div class="form-grid" style="grid-template-columns: 3fr 1fr;">
                         <div class="form-group">
                            <label for="amount">Amount</label>
                            <input type="number" id="amount" placeholder="Exp: 100000.00" required>
                            <div class="error-message" id="error-amount"></div>
                        </div>
                        <div class="form-group">
                            <label for="currency">Currency</label>
                            <select id="currency" required>
                                <option value="" disabled selected>-- Select Currency --</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="VND">VND</option>
                            </select>
                            <div class="error-message" id="error-currency"></div>
                        </div>
                    </div>
                </section>


                <section class="form-section">
                    <h2>Shipment Terms</h2>
                   
                    <div class="form-group">
                        <label for="goods_description">Description of Goods & Services</label>
                        <textarea id="goods_description" rows="3" placeholder="Exp: 1000 units of Model XYZ electronic components..." required></textarea>
                        <div class="error-message" id="error-goods_description"></div>
                    </div>


                    <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                        <div class="form-group">
                            <label for="port_loading">Port of Loading</label>
                            <input type="text" id="port_loading" placeholder="Exp: Port of Singapore" required>
                            <div class="error-message" id="error-port_loading"></div>
                        </div>
                        <div class="form-group">
                            <label for="port_discharge">Port of Discharge</label>
                            <input type="text" id="port_discharge" placeholder="Exp: Cat Lai Port" required>
                            <div class="error-message" id="error-port_discharge"></div>
                        </div>
                         <div class="form-group">
                            <label for="latest_shipment">Latest Date of Shipment</label>
                            <input type="date" id="latest_shipment" required>
                            <div class="error-message" id="error-latest_shipment"></div>
                        </div>
                    </div>
                </section>


                <section class="form-section">
                    <h2>Required Documents & Uploads</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label style="font-weight: 600; margin-bottom: 10px;">Select Required Documents:</label>
                            <div class="checkbox-group">
                                <label class="remember"><input type="checkbox" name="doc" value="Commercial Invoice"> Commercial Invoice</label>
                                <label class="remember"><input type="checkbox" name="doc" value="Bill of Lading"> Bill of Lading</label>
                                <label class="remember"><input type="checkbox" name="doc" value="Certificate of Origin"> Certificate of Origin</label>
                                <label class="remember"><input type="checkbox" name="doc" value="Insurance Certificate"> Insurance Certificate</label>
                                <label class="remember"><input type="checkbox" name="doc" value="Packing List"> Packing List</label>
                            </div>
                             <div class="form-group" style="margin-top: 20px;">
                                <label for="other_reqs">Other Requirements (If applicable):</label>
                                <textarea id="other_reqs" rows="2" placeholder="Exp: Giấy chứng nhận kiểm định độc lập..."></textarea>
                            </div>
                        </div>


                        <div class="form-group">
                             <label>Upload Supporting Documents (e.g., Sales Contract):</label>
                             <div class="drop-zone" id="drop-zone">
                                <i class="fas fa-upload"></i>
                                <span>Drag & drop files here or Click to upload</span>
                                <div class="file-list" id="file-list"></div>
                                <input id="file-input" type="file" multiple style="display:none;" />
                            </div>
                        </div>
                    </div>
                </section>
               
                <div class="form-actions">
                    <button type="button" id="save-draft-btn" class="btn btn-secondary">Save as Draft</button>
                    <button type="submit" class="btn btn-primary">Proceed to Review</button>
                </div>


            </form>
        </main>
    </div>
   
    <script src="dashboard.js" defer></script>
    <script src="lc.js" defer></script>
   
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const termGroup = document.getElementById('usance-terms-group');
            const hiddenInput = document.getElementById('payment_term');
           
            // Tìm container của 2 nút
            const termToggle = document.querySelector('.fee-toggle');
            if (!termToggle) return;


            termToggle.addEventListener('click', function(e) {
                const clickedBtn = e.target.closest('.fee-btn');
                if (!clickedBtn) return; // Bấm ra ngoài


                // Bỏ active tất cả
                termToggle.querySelectorAll('.fee-btn').forEach(b => b.classList.remove('active'));
               
                // Active nút được bấm
                clickedBtn.classList.add('active');
               
                const term = clickedBtn.getAttribute('data-term');
               
                // Cập nhật input ẩn
                if(hiddenInput) hiddenInput.value = term;
               
                // Ẩn/hiện ô Usance Terms
                if(termGroup) {
                    termGroup.style.display = (term === 'Usance') ? 'block' : 'none';
                }
            });
        });
    </script>
</body>
</html>
