<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS - Profile</title>
   
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://kit.fontawesome.com/4383773ea8.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="overlay" id="overlay"></div>


    <div class="page-bg" aria-hidden="true">
        <img src="images/background.png" alt="background" class="bg-image">
    </div>


    <div class="dashboard-container">
       
        <aside class="sidebar" id="sidebar">
                        <div class="sidebar-logo">
                <img src="images/logo_icon.png" alt="Logo Icon">
                <span class="brand-name">CHRONOS</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="dashboard.html">
                            <i class="fas fa-home"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="transaction.html"><i class="fas fa-exchange-alt"></i><span>Transactions</span></a>
                    </li>
                    <li>
                        <a href="document.html"><i class="fas fa-folder"></i></i><span>Documents</span></a>
                    </li>
                    <li class="active">
                        <a href="profile.html">
                            <i class="fas fa-user"></i>
                            <span>Profile</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-logout">
                <a href="login.html">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>


        <main class="main-content">
            <header class="main-header">
                <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu">
                    <span></span><span></span><span></span>
                </button>
                <h1>Business Information (Profile)</h1>
            </header>


            <form class="form-card" id="profile-form">
               
                <section class="form-section">
                    <h2>Account Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" value="John Doe" disabled class="readonly-input">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" value="john.doe@example.com" disabled class="readonly-input">
                        </div>
                    </div>
                </section>


                <section class="form-section">
                    <h2>Business Information</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="business-name">Business Name</label>
                            <input type="text" id="business-name" value="Doe Enterprises">
                            <div class="error-message" id="error-business-name"></div>
                        </div>
                        <div class="form-group">
                            <label for="tax-id">Tax ID</label>
                            <input type="text" id="tax-id" value="1234567890">
                            <div class="error-message" id="error-tax-id"></div>
                        </div>


                        <div class="form-group">
                            <label for="registration-country">Country of Registration</label>
                            <select id="registration-country">
                                <option value="">-- Select Country --</option>
                                <option value="USA">United States</option>
                                <option value="SGP" selected>Singapore</option> <option value="VNM">Vietnam</option>
                                </select>
                             <div class="error-message" id="error-registration-country"></div>
                        </div>
                        <div class="form-group">
                            <label for="industry-type">Industry / Business Type</label>
                            <select id="industry-type">
                                <option value="">-- Select Industry --</option>
                                <option value="MANUFACTURING">Manufacturing</option>
                                <option value="RETAIL" selected>Retail</option> <option value="SERVICES">Services</option>
                                <option value="TECHNOLOGY">Technology</option>
                                </select>
                            <div class="error-message" id="error-industry-type"></div>
                        </div>
                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" placeholder="Enter business address">
                        </div>
                         <div class="form-group">
                            <label for="contact-person">Contact Person</label>
                            <input type="text" id="contact-person" placeholder="Enter contact person's name">
                        </div>
                        <div class="form-group">
                            <label for="phone-number">Phone Number</label>
                            <input type="tel" id="phone-number" placeholder="Enter phone number">
                        </div>
                    </div>
                </section>


                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">Save Changes</button>
                </div>
               
            </form>            
        </main>
    </div>
   
    <script src="dashboard.js" defer></script>
    <script src="profile.js" defer></script>
</body>
</html>
